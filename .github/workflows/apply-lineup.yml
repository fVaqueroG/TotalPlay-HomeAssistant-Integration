name: Apply Totalplay reference lineup
on:
  push:
    paths: [.github/workflows/apply-lineup.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded source patch
        run: python scripts/enable_reference_lineup.py
      - name: Validate patched frontend and EPG
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          python -m compileall -q custom_components/totalplay_stb tests
          python -m unittest discover -s tests -v
      - name: Commit reviewed source and remove one-time patch machinery
        shell: bash
        run: |
          rm -f scripts/enable_reference_lineup.py .github/workflows/apply-lineup.yml .github/workflows/lineup-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable bundled Totalplay channel and app reference catalog in visual card'
          git push origin HEAD:main
