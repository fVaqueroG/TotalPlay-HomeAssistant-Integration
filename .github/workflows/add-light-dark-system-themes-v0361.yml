name: Add Totalplay card themes v0.3.61
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-light-dark-system-themes-v0361.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement Light Dark and System in full and popup cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('custom_components/totalplay_stb')
          main=root/'www/totalplay-stb-card.js'
          popup=root/'www/totalplay-stb-popup-card.js'
          m=main.read_text()
          p=popup.read_text()
          def once(text,old,new,where):
              count=text.count(old)
              assert count==1,f'{where}: expected one anchor, got {count}: {old[:100]!r}'
              return text.replace(old,new,1)
          palette='''window.tpApplyCardTheme = (target, selected) => {
            if (!target) return;
            const colors = {
              light: {'--card-background-color':'#ffffff','--ha-card-background':'#ffffff','--primary-text-color':'#182436','--secondary-text-color':'#58697d','--secondary-background-color':'#edf2f7','--divider-color':'#d8e0e9','--ha-card-border-color':'#d8e0e9','--tp-bg':'#ffffff','--tp-ink':'#182436','--tp-muted':'#58697d','--tp-edge':'#d8e0e9'},
              dark: {'--card-background-color':'#171b24','--ha-card-background':'#171b24','--primary-text-color':'#f2f5fb','--secondary-text-color':'#aab6c8','--secondary-background-color':'#283142','--divider-color':'#465267','--ha-card-border-color':'#465267','--tp-bg':'#171b24','--tp-ink':'#f2f5fb','--tp-muted':'#aab6c8','--tp-edge':'#465267'}
            };
            for (const name of Object.keys(colors.light)) target.style.removeProperty(name);
            target.style.removeProperty('color-scheme');
            if (Object.hasOwn(colors,selected)) {
              for (const [name,value] of Object.entries(colors[selected])) target.style.setProperty(name,value);
              target.style.setProperty('color-scheme',selected);
            }
          };
          '''
          m=once(m,"previous_channel_command:'KEY_TV_SWAP'};","previous_channel_command:'KEY_TV_SWAP',theme:'system'};\n"+palette,'default and theme helper')
          m=once(m,"static getStubConfig(hass){return{entity:tpPlayers(hass)[0]?.[0]||'',title:'Totalplay TV'};}","static getStubConfig(hass){return{entity:tpPlayers(hass)[0]?.[0]||'',title:'Totalplay TV',theme:'system'};}",'stub theme')
          m=once(m,'this._limit=30;this._build();}',"this._limit=30;this._build();window.tpApplyCardTheme(this,this._config.theme);}",'full card config')
          m=once(m,'set hass(hass){this._hass=hass;if(!this._config)return;', 'set hass(hass){this._hass=hass;if(!this._config)return;window.tpApplyCardTheme(this,this._config.theme);','full card hass')
          m=once(m,"this._field(root,'Card title',this._config.title,v=>this._change({title:v}));this._checkbox", "this._field(root,'Card title',this._config.title,v=>this._change({title:v}));this._select(root,'Theme',[['system','System (Home Assistant)'],['light','Light'],['dark','Dark']],this._config.theme||'system',v=>this._change({theme:v}));this._checkbox",'visual editor')
          p=once(p,'button.addEventListener(\'click\',()=>this._openPopup());\n    card.append(button);root.append(css,card);', "button.addEventListener('click',()=>this._openPopup());\n    card.append(button);root.append(css,card);\n    window.tpApplyCardTheme(this,this._config.theme);\n    if (this._dialog) window.tpApplyCardTheme(this._dialog,this._config.theme);",'popup button')
          p=once(p,'this._hass=hass;\n    if (this._popupCard && this._dialog?.open)', 'this._hass=hass;\n    window.tpApplyCardTheme(this,this._config?.theme);\n    if (this._dialog) window.tpApplyCardTheme(this._dialog,this._config?.theme);\n    if (this._popupCard && this._dialog?.open)','popup hass')
          p=once(p,'document.body.appendChild(dialog);\n    try {', 'document.body.appendChild(dialog);\n    window.tpApplyCardTheme(dialog,this._config.theme);\n    try {','popup dialog')
          manifest=root/'manifest.json'
          cfg=json.loads(manifest.read_text())
          assert cfg['version']=='0.3.60',cfg['version']
          cfg['version']='0.3.61'
          main.write_text(m)
          popup.write_text(p)
          manifest.write_text(json.dumps(cfg,indent=2)+'\n')
          print('Added visual-editor themes to Totalplay full card, popup launcher and dialog')
          PY
      - name: Validate card syntax and theme controls
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node --check custom_components/totalplay_stb/www/totalplay-stb-popup-card.js
          python3 -m json.tool custom_components/totalplay_stb/manifest.json >/dev/null
          grep -q "this._select(root,'Theme'" custom_components/totalplay_stb/www/totalplay-stb-card.js
          grep -q 'window.tpApplyCardTheme(dialog' custom_components/totalplay_stb/www/totalplay-stb-popup-card.js
      - name: Commit verified changes and remove one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-light-dark-system-themes-v0361.yml
          git add custom_components/totalplay_stb/www/totalplay-stb-card.js custom_components/totalplay_stb/www/totalplay-stb-popup-card.js custom_components/totalplay_stb/manifest.json
          git commit -m 'v0.3.61: add light, dark and system card themes'
          git push origin HEAD:main
          gh release create v0.3.61 --target "$(git rev-parse HEAD)" --title v0.3.61 --notes 'Add Light, Dark and System to the Totalplay full and popup cards through the visual editor; the System setting inherits the Home Assistant theme. Existing channel, remote and popup settings remain intact.'