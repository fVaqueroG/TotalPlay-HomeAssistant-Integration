name: Finalize Totalplay visual editor dropdown fix v0.3.62
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-editor-dropdown-fix-v0362.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve dropdowns without breaking editor action buttons
        run: python3 .github/scripts/finalize_editor_dropdown_fix_v0362.py
      - name: Validate card code and version
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node --check custom_components/totalplay_stb/www/totalplay-stb-popup-options.js
          python3 -m json.tool custom_components/totalplay_stb/manifest.json >/dev/null
          grep -q '"version": "0.3.62"' custom_components/totalplay_stb/manifest.json
      - name: Commit corrected editor and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-editor-dropdown-fix-v0362.yml .github/scripts/finalize_editor_dropdown_fix_v0362.py
          git add custom_components/totalplay_stb/www/totalplay-stb-card.js
          git commit -m 'v0.3.62: preserve dropdowns and editor action buttons'
          git push origin HEAD:main
          gh release create v0.3.62 --target "$(git rev-parse HEAD)" --title v0.3.62 --notes 'Prevent Home Assistant state updates and configuration echoes from collapsing dropdowns in the full and popup Totalplay visual configurators. Preserve Add/Remove override buttons. Normal playback popup behavior is unchanged.'