name: Apply Totalplay EPG and TV compatibility fix

on:
  push:
    paths:
      - .github/workflows/fix-epg-display.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded EPG frontend patch
        run: python scripts/fix_epg_ui.py
      - name: Test frontend guide matching and visual editor
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const classes=new Map();const ctx={HTMLElement:class{},window:{customCards:[]},customElements:{get:n=>classes.get(n),define:(n,c)=>classes.set(n,c)},console};
          vm.runInNewContext(fs.readFileSync('custom_components/totalplay_stb/www/totalplay-stb-card.js','utf8'),ctx);
          const guide={channels:[{id:'one.mx',name:'Azteca Uno HD',names:['Azteca Uno HD','Azteca 1'],schedule:[]},{id:'five.mx',name:'Canal 5',schedule:[]}]};
          assert.equal(vm.runInNewContext('tpGuideMatch',ctx)(guide,{name:'Azteca Uno'}).id,'one.mx');
          assert.equal(vm.runInNewContext('tpGuideMatch',ctx)(guide,{name:'Canal 5'}).id,'five.mx');
          assert.equal(vm.runInNewContext('tpGuideMatch',ctx)(guide,{name:'Other Station'}),null);
          assert.equal(vm.runInNewContext('tpGuideMatch',ctx)(guide,{name:'Other Station',epg_id:'one.mx'}).id,'one.mx');
          const ambiguous={channels:[...guide.channels,{id:'other.mx',name:'Azteca Uno SD'}]};
          assert.equal(vm.runInNewContext('tpGuideMatch',ctx)(ambiguous,{name:'Azteca Uno'}),null);
          assert(classes.has('totalplay-stb-card-editor'));
          const source=fs.readFileSync('custom_components/totalplay_stb/www/totalplay-stb-card.js','utf8');
          assert(source.includes('TV guide unavailable')&&source.includes('EPG station for this channel'));
          console.log('Card EPG alias match, ambiguous match, explicit ID and visual editor assertions passed');
          JS
      - name: Test Python components
        run: |
          python -m compileall -q custom_components/totalplay_stb tests
          python -m unittest discover -s tests -v
      - name: Commit source, remove one-time patch tools
        run: |
          git rm -f scripts/fix_epg_ui.py .github/workflows/fix-epg-display.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Show guide status and improve precise XMLTV matching; tolerate unsupported TV sources'
          git push origin HEAD:main
