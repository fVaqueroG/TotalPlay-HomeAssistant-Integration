name: Finish and release Totalplay Back to top v0.3.66
on:
  push:
    paths:
      - .github/workflows/finish-totalplay-back-top-v0366.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish nested scroll handling and preserve EPG horizontal position
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/totalplay_stb/www/totalplay-stb-v0366.js')
          s=p.read_text()
          def replace_once(old,new):
              global s
              count=s.count(old)
              if count!=1: raise RuntimeError(f'Expected one match, got {count}: {old[:90]!r}')
              s=s.replace(old,new,1)
          replace_once('font:700 13px/1.2 inherit;cursor:pointer;',
                       'font-family:inherit;font-size:13px;font-weight:700;line-height:1.2;cursor:pointer;')
          replace_once('  if (document.scrollingElement) tp66UniquePush(list,document.scrollingElement);',
                       "  if (!card.closest('.tp-stb-popup-body') && document.scrollingElement)\n    tp66UniquePush(list,document.scrollingElement);")
          replace_once("node.scrollTo({top:0,behavior:'smooth'})",
                       "node.scrollTo({top:0,left:node.scrollLeft,behavior:'smooth'})")
          replace_once('function tp66Ensure(card) {', '''function tp66Observe(card) {
            // Scroll events from the card's shadow root are not guaranteed to
            // reach window listeners. Watch the actual guide, apps and popup
            // containers and replace listeners when setConfig rebuilds them.
            const nodes=[card._scroll,card._appsPanel,
              card._appsPanel?.querySelector('.apps-only'),
              card.shadowRoot?.querySelector('.main > .apps-only:not(.hidden)'),
              card.closest('.tp-stb-popup-body')].filter(Boolean);
            const previous=card._tp66Nodes||[];
            const callback=card._tp66ScrollListenerLocal ||
              (card._tp66ScrollListenerLocal=()=>tp66Schedule(card));
            for(const node of previous) if(!nodes.includes(node))
              node.removeEventListener('scroll',callback);
            for(const node of nodes) if(!previous.includes(node))
              node.addEventListener('scroll',callback,{passive:true});
            card._tp66Nodes=nodes;
          }
          function tp66Ensure(card) {''')
          replace_once('  card._tp66Button=button;\n  if (card.isConnected',
                       '  card._tp66Button=button;\n  tp66Observe(card);\n  if (card.isConnected')
          replace_once('  tp66Schedule(this);\n  return result;\n};\nconst tp66OriginalDisconnect',
                       '  tp66Observe(this);tp66Schedule(this);\n  return result;\n};\nconst tp66OriginalDisconnect')
          replace_once('  if (this._tp66Frame) cancelAnimationFrame(this._tp66Frame);',
                       '''  for (const node of this._tp66Nodes||[])
            node.removeEventListener('scroll',this._tp66ScrollListenerLocal);
          this._tp66Nodes=[];
          if (this._tp66Frame) cancelAnimationFrame(this._tp66Frame);''')
          p.write_text(s)
          import json
          manifest=Path('custom_components/totalplay_stb/manifest.json')
          data=json.loads(manifest.read_text())
          assert data['version']=='0.3.65', data['version']
          data['version']='0.3.66'
          manifest.write_text(json.dumps(data,indent=2)+'\n')
          init=Path('custom_components/totalplay_stb/__init__.py').read_text()
          assert '"totalplay-stb-v0366.js"' in init
          print('Patched scroll target listeners and prepared v0.3.66')
          PY
      - name: Check the new UI and existing guide and popup behavior
        shell: bash
        run: |
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0366.js
          python -m compileall -q custom_components/totalplay_stb
          node - <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const s=fs.readFileSync('custom_components/totalplay_stb/www/totalplay-stb-v0366.js','utf8');
          assert.match(s,/function tp66Observe\(card\)/);
          assert.match(s,/node\.addEventListener\('scroll',callback,\{passive:true\}\)/);
          assert.match(s,/node\.removeEventListener\('scroll',callback\)/);
          assert.match(s,/node\.scrollTo\(\{top:0,left:node\.scrollLeft,behavior:'smooth'\}\)/);
          assert.match(s,/!card\.closest\('\.tp-stb-popup-body'\) && document\.scrollingElement/);
          assert.match(s,/tp66Ensure\(this\)/);
          assert.match(s,/tp66Observe\(this\);tp66Schedule\(this\)/);
          assert.match(s,/button\.hidden=!visible/);
          console.log('PASS: nested guide, app and popup listeners, back-to-top and horizontal EPG preserved');
          JS
          node tests/test_guide_horizontal_timeline.cjs
          node tests/test_pages_remote_v0313.cjs
          node tests/test_black_header.cjs
      - name: Commit the verified change and trigger versioned HACS release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finish-totalplay-back-top-v0366.yml
          git add custom_components/totalplay_stb/manifest.json custom_components/totalplay_stb/www/totalplay-stb-v0366.js custom_components/totalplay_stb/__init__.py
          git commit -m 'Release Totalplay v0.3.66 with floating back-to-top for guide and popup'
          git push origin HEAD:main
