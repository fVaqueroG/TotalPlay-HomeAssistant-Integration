name: Repair and validate IPTV guide card
on:
  push:
    paths:
      - .github/workflows/fix-guide-syntax.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Correct Remote button and validate card syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/totalplay_stb/www/totalplay-stb-card.js')
          text=p.read_text()
          old="this._remoteToggle.classList.toggle('primary',!!this._remoteOpen);},'btn'));"
          assert text.count(old)==1, 'Expected button handler not found'
          p.write_text(text.replace(old,"this._remoteToggle.classList.toggle('primary',!!this._remoteOpen);},'btn');"))
          Path('.github/workflows/fix-guide-syntax.yml').unlink()
          PY
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          python -m unittest discover -s tests -v
      - name: Commit tested fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/totalplay_stb/www/totalplay-stb-card.js .github/workflows/fix-guide-syntax.yml
          git commit -m 'Fix IPTV guide card Remote button handler syntax'
          git push