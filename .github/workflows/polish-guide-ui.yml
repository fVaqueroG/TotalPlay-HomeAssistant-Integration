name: Polish Totalplay guide UI
on:
  push:
    paths:
      - .github/workflows/polish-guide-ui.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve lineup names and improve remote and EPG editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('custom_components/totalplay_stb/www/totalplay-stb-card.js')
          text=p.read_text(encoding='utf-8')
          changes=[
            ("by.set(id,{...(by.get(id)||{}),...ch});", "const base=by.get(id)||{};by.set(id,{...base,...ch,name:ch.name||base.name||''});"),
            ("for(const [label,cmd] of items)row.appendChild(this._key(label,cmd));return row;", "for(const [label,cmd] of items)row.appendChild(this._key(label,cmd,'key'+(/^[0-9]$/.test(label)?' digit':'')));return row;"),
            ("[['CH −','channel_down'],['Previous','KEY_TV_SWAP'],['CH +','channel_up']]", "[['CH −','channel_down'],['Previous',this._config.previous_channel_command],['CH +','channel_up']]"),
            ("this._field(row,'Program sensor (optional)',item.program_entity,v=>this._replace(kind,index,{program_entity:v}));", "if(!this._guideOptions?.length)this._field(row,'XMLTV station ID (manual)',item.epg_id,v=>this._replace(kind,index,{epg_id:v}));this._field(row,'Program sensor (optional)',item.program_entity,v=>this._replace(kind,index,{program_entity:v}));"),
          ]
          for old,new in changes:
            assert text.count(old)==1, f'Cannot safely apply patch: {old}'
            text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          Path('.github/workflows/polish-guide-ui.yml').unlink()
          PY
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node tests/test_card_guide.js
          python -m unittest discover -s tests -q
      - name: Commit tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/totalplay_stb/www/totalplay-stb-card.js .github/workflows/polish-guide-ui.yml
          git commit -m 'Polish guide station overrides and Totalplay keypad'
          git push