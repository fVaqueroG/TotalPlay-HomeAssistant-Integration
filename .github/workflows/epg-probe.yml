name: Probe Mexico XMLTV feeds

on:
  push:
    paths:
      - .github/workflows/epg-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published MX guide URLs and programme coverage
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import gzip
          import io
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          sources = {
              'old iptv-org mi.tv URL': 'https://iptv-org.github.io/epg/guides/mx/mi.tv.epg.xml',
              'Mexico public XMLTV candidate': 'https://iptv-epg.org/files/epg-mx.xml',
          }
          now = dt.datetime.now(dt.timezone.utc)
          print('Probe UTC:', now.isoformat(), flush=True)
          for name, url in sources.items():
              print('\nSOURCE:', name, '\nURL:', url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Totalplay-EPG-ReadOnly-Probe/1.0', 'Accept': 'application/xml,text/xml,*/*'})
                  with urllib.request.urlopen(req, timeout=25) as res:
                      content_type = res.headers.get('content-type')
                      data = res.read(40_000_001)
                      print('HTTP:', res.status, 'content-type:', content_type, 'download-bytes:', len(data), flush=True)
                      if len(data) > 40_000_000: raise ValueError('guide exceeds 40 MB probe limit')
                  if data[:2] == b'\x1f\x8b': data = gzip.decompress(data)
                  channels = {}
                  programs = 0
                  active = set()
                  future = set()
                  samples = []
                  for event, node in ET.iterparse(io.BytesIO(data), events=('end',)):
                      if node.tag == 'channel':
                          channels[node.get('id', '')] = (node.findtext('display-name') or '').strip()
                          node.clear()
                      elif node.tag == 'programme':
                          programs += 1
                          ch = node.get('channel', '')
                          start_str = node.get('start', '')
                          stop_str = node.get('stop', '')
                          try:
                              start = dt.datetime.strptime(start_str[:14], '%Y%m%d%H%M%S').replace(tzinfo=dt.timezone.utc)
                              stop = dt.datetime.strptime(stop_str[:14], '%Y%m%d%H%M%S').replace(tzinfo=dt.timezone.utc)
                              # Parse dates only for a freshness indication; XMLTV may include UTC offsets.
                              if start <= now < stop: active.add(ch)
                              if start > now: future.add(ch)
                          except ValueError:
                              pass
                          if len(samples) < 6 and node.findtext('title'):
                              samples.append((ch, node.findtext('title'), start_str, stop_str))
                          node.clear()
                  print('XMLTV CHANNELS:', len(channels), 'PROGRAMMES:', programs, flush=True)
                  print('APPROX CURRENT SCHEDULE CHANNELS:', len(active), 'FUTURE SCHEDULE CHANNELS:', len(future), flush=True)
                  print('SAMPLES:', samples, flush=True)
                  print('VERDICT:', 'usable guide candidate, not yet mapped to Totalplay' if channels and programs and (active or future) else 'no confirmed current EPG coverage', flush=True)
              except Exception as e:
                  print('VERDICT: unavailable or invalid -', type(e).__name__, str(e)[:250], flush=True)
          PY
