name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public EPGTalk Latino feed end-to-end
        run: |
          python - <<'PY'
          import gzip, importlib.util, pathlib, urllib.request
          path = pathlib.Path('custom_components/totalplay_stb/epg_data.py')
          spec = importlib.util.spec_from_file_location('epg_data_live_smoke', path)
          parser = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(parser)
          url = 'https://raw.githubusercontent.com/acidjesuz/EPGTalk/master/Latino_guide.xml.gz'
          with urllib.request.urlopen(url, timeout=50) as response:
              with gzip.GzipFile(fileobj=response) as stream:
                  data = parser.parse_xmltv_stream(stream)
          print('EPGTalk live XMLTV:', {key: data[key] for key in (
              'programme_count', 'valid_timestamp_count', 'window_programme_count',
              'scheduled_channel_count')}, 'stations:', len(data['channels']))
          print('Sample stations with current listings:', [ch['name'] for ch in data['channels'] if ch['schedule']][:12])
          assert data['channels'] and data['programme_count'] and data['window_programme_count'], 'Live guide has no current programmes'
          PY
      - name: Check Python syntax
        run: python -m compileall -q custom_components/totalplay_stb tests
      - name: Test Totalplay HTTP, Netflix, EPG fallback and display selection
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node --check custom_components/totalplay_stb/www/totalplay-guide-v3.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-epg-responsive.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-pages-remote.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-guide-layout-v036.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-app-logos.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v038.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0310.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0311.js
      - name: Test IPTV guide, EPG mapping, scrolling, pages, layout, logos and optional power switch
        run: |
          node tests/test_card_guide.js
          node tests/test_guide_v3.cjs
          node tests/test_epg_responsive.cjs
          node tests/test_guide_autoscroll.cjs
          node tests/test_pages_remote.cjs
          node tests/test_guide_layout.cjs
          node tests/test_app_logos.cjs
          node tests/test_hbomax.cjs
          node tests/test_power_helper.cjs
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
