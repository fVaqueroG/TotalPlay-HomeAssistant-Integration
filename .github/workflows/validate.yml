name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q custom_components/totalplay_stb tests
      - name: Test Totalplay HTTP, Netflix, EPG fallback and display selection
        run: python -m unittest discover -s tests -v
      - name: Check dashboard JavaScript syntax
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node --check custom_components/totalplay_stb/www/totalplay-guide-v3.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-epg-responsive.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-pages-remote.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-guide-layout-v036.js
      - name: Test IPTV guide, EPG mapping, scrolling, pages and layout
        run: |
          node tests/test_card_guide.js
          node tests/test_guide_v3.cjs
          node tests/test_epg_responsive.cjs
          node tests/test_guide_autoscroll.cjs
          node tests/test_pages_remote.cjs
          node tests/test_guide_layout.cjs
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
