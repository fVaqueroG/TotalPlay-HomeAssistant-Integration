name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python -m compileall -q custom_components/totalplay_stb tests
      - name: Test Totalplay HTTP, Netflix and display selection
        run: python -m unittest discover -s tests -v
      - name: Check dashboard card JavaScript syntax
        run: node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
      - name: Smoke-test IPTV timeline, guide state and remote
        run: node tests/test_card_guide.js
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
