name: Publish versioned HACS release

on:
  push:
    branches: [main]
    paths:
      - custom_components/totalplay_stb/manifest.json
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: totalplay-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read and validate integration version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          manifest = json.loads(Path('custom_components/totalplay_stb/manifest.json').read_text(encoding='utf-8'))
          version = manifest['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit(f'Expected version MAJOR.MINOR.PATCH, got {version!r}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'tag=v{version}\n')
          print(f'Publishing (if missing): v{version}')
          PY

      - name: Publish GitHub release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; not replacing an immutable release."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes "Totalplay STB Local Remote $RELEASE_TAG. Experimental local HTTP remote control for Sagemcom DIW362 UHD; decoder command behavior has not yet been confirmed on physical hardware."
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
              --notes "Totalplay STB Local Remote $RELEASE_TAG. Experimental local HTTP remote control for Sagemcom DIW362 UHD; decoder command behavior has not yet been confirmed on physical hardware."
          fi
