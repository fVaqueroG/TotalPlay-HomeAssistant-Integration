name: Verify Totalplay appearance palettes
on:
  push:
    paths:
      - custom_components/totalplay_stb/www/totalplay-stb-v0365.js
      - .github/workflows/verify-totalplay-themes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate theme frontend module syntax and independent palettes
        shell: bash
        run: |
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0365.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0364.js
          node --input-type=module --check < custom_components/totalplay_stb/www/totalplay-stb-v0363.js
          node - <<'JS'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const js = fs.readFileSync('custom_components/totalplay_stb/www/totalplay-stb-v0365.js','utf8');
          const init = fs.readFileSync('custom_components/totalplay_stb/__init__.py','utf8');
          assert.ok(js.includes('data-tp-palette="dark"'));
          assert.ok(js.includes('data-tp-palette="system"'));
          assert.ok(js.includes('--tp65-canvas:#151725'));
          assert.ok(js.includes('--tp65-canvas:var(--ha-card-background'));
          assert.ok(js.includes('tp65ApplyFull(popup._popupCard)'));
          assert.ok(init.includes('totalplay-stb-v0365.js'));
          console.log('Totalplay light, branded dark and HA-native system theme guards verified');
          JS
