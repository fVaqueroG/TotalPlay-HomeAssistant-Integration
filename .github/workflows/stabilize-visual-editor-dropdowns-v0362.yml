name: Stabilize Totalplay visual editor dropdowns v0.3.62
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stabilize-visual-editor-dropdowns-v0362.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve active dropdowns in full and popup editors
        run: python3 .github/scripts/stabilize_visual_editor_dropdowns_v0362.py
      - name: Validate frontend and manifest
        run: |
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
          node --check custom_components/totalplay_stb/www/totalplay-stb-popup-options.js
          python3 -m json.tool custom_components/totalplay_stb/manifest.json >/dev/null
      - name: Commit validated changes and remove migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stabilize-visual-editor-dropdowns-v0362.yml .github/scripts/stabilize_visual_editor_dropdowns_v0362.py
          git add custom_components/totalplay_stb
          git commit -m 'v0.3.62: preserve visual editor dropdowns during HA updates'
          git push origin HEAD:main