name: Apply 50 ms digit timing
on:
  push:
    paths:
      - .github/workflows/apply-fast-digit-timing.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply timing change and update tests
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('custom_components/totalplay_stb/media_player.py')
          text = source.read_text()
          old = '_CHANNEL_DIGIT_DELAY_SECS = 0.10'
          assert text.count(old) == 1, 'Channel digit delay has changed unexpectedly'
          source.write_text(text.replace(old, '_CHANNEL_DIGIT_DELAY_SECS = 0.05'))
          tests = Path('tests/test_netflix.py')
          text = tests.read_text()
          old_sleep = '("sleep", 0.1)'
          assert text.count(old_sleep) >= 4, 'Expected digit spacing assertions not found'
          tests.write_text(text.replace(old_sleep, '("sleep", 0.05)'))
          timing = Path('tests/test_menu_exit_timing.py')
          text = timing.read_text()
          old_assert = 'self.assertEqual(player_module._CHANNEL_DIGIT_DELAY_SECS, 0.10)'
          assert text.count(old_assert) == 1
          timing.write_text(text.replace(old_assert, 'self.assertEqual(player_module._CHANNEL_DIGIT_DELAY_SECS, 0.05)'))
          Path('.github/workflows/apply-fast-digit-timing.yml').unlink()
          PY
          python -m unittest discover -s tests -v
          python -m compileall -q custom_components/totalplay_stb tests
          node --check custom_components/totalplay_stb/www/totalplay-stb-card.js
      - name: Commit change and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/totalplay_stb/media_player.py tests/test_netflix.py tests/test_menu_exit_timing.py .github/workflows/apply-fast-digit-timing.yml
          git commit -m 'Send Totalplay channel and app digits 50 ms apart'
          git push